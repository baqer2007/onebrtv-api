<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشغل الفيديوهات متعدد السيرفرات</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0c10;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }
    .player-container {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .controls {
      width: 100%;
      max-width: 960px;
      margin-top: 20px;
    }
    .controls h3 {
      margin-bottom: 12px;
      font-size: 1.1rem;
      color: #66fcf1;
    }
    .server-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .server-btn {
      background-color: #1f2833;
      color: #c5c6c7;
      border: 1px solid #45a29e;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }
    .server-btn:hover {
      background-color: #45a29e;
      color: #0b0c10;
    }
    .server-btn.active {
      background-color: #66fcf1;
      color: #0b0c10;
      font-weight: bold;
    }
    #status {
      margin-bottom: 15px;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div id="status">جاري تجهيز السيرفرات... ⏳</div>

  <!-- 📺 إطار عرض الفيديو -->
  <div class="player-container">
    <iframe id="videoPlayer" allowfullscreen allow="autoplay; fullscreen; encrypted-media"></iframe>
  </div>

  <!-- 🎛️ قائمة أزرار السيرفرات -->
  <div class="controls">
    <h3>اختر السيرفر 🌐:</h3>
    <div class="server-list" id="serverButtons"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const statusEl = document.getElementById('status');
      const player = document.getElementById('videoPlayer');
      const buttonsContainer = document.getElementById('serverButtons');

      // 1. قراءة المعاملات من الرابط الحالي
      const params = new URLSearchParams(window.location.search);
      const type = params.get('type') || 'movie';
      const id = params.get('id');
      const s = params.get('s');
      const e = params.get('e');

      if (!id) {
        statusEl.innerText = 'يرجى تحديد معرف العمل id في الرابط ❌';
        return;
      }

      try {
        // 2. طلب قائمة السيرفرات من الـ API
        let apiUrl = `/api/servers?type=${type}&id=${id}`;
        if (s && e) apiUrl += `&s=${s}&e=${e}`;

        const res = await fetch(apiUrl);
        const data = await res.json();

        if (!data.success || data.servers.length === 0) {
          statusEl.innerText = 'لم يتم العثور على سيرفرات متاحة ⚠️';
          return;
        }

        statusEl.style.display = 'none';

        // 3. تشغيل السيرفر الأول افتراضياً
        player.src = data.servers[0].url;

        // 4. إنشاء زر لكل سيرفر
        data.servers.forEach((server, index) => {
          const btn = document.createElement('button');
          btn.className = `server-btn ${index === 0 ? 'active' : ''}`;
          btn.innerText = server.name;

          btn.addEventListener('click', () => {
            // تحديث رابط المشغل
            player.src = server.url;

            // تمييز الزر النشط
            document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
          });

          buttonsContainer.appendChild(btn);
        });

      } catch (err) {
        statusEl.innerText = 'حدث خطأ أثناء تحميل السيرفرات ❌';
      }
    });
  </script>
</body>
</html>
